name: Set site password

# Change the password: Settings → Secrets and variables → Actions → edit SITE_PASSWORD,
# then Actions → "Set site password" → Run workflow. Live in about two minutes.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rewrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-wrap the content key with the new password
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
        run: node scripts/rewrap.mjs
      - name: Commit key.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add key.json
          git commit -m "Rotate site password" || echo "No change"
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
